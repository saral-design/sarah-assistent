name: Update Hot Search Data
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch hot search data
        run: |
          python3 << 'EOF'
          import urllib.request
          import json

          apis = {
              'weibo': 'https://uapis.cn/api/v1/misc/hotboard?type=weibo',
              'xiaohongshu': 'https://uapis.cn/api/v1/misc/hotboard?type=xiaohongshu',
              'toutiao': 'https://uapis.cn/api/v1/misc/hotboard?type=toutiao',
              '36kr': 'https://uapis.cn/api/v1/misc/hotboard?type=36kr'
          }

          result = {}
          for name, url in apis.items():
              try:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  })
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                  items = data.get('list', [])
                  result[name] = [{
                      'title': i.get('title', ''),
                      'hot': str(i.get('hot_value', ''))
                  } for i in items[:10]]
                  print(f'{name}: {len(result[name])} items')
              except Exception as e:
                  print(f'{name}: ERROR - {e}')
                  result[name] = []

          import datetime
          result['_updated'] = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')

          with open('hot-data.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print('Saved hot-data.json')
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hot-data.json
          git diff --staged --quiet || git commit -m "Auto-update hot search data"
          git push
