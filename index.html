<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="萨拉的生活助理">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/apple-touch-icon.png">
<title>萨拉的生活助理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg-main:#FAF6F0;--bg-card:#FFFDF9;--bg-sidebar:#F3EDE3;--bg-hover:#EDE4D6;--text-primary:#5D4E3C;--text-secondary:#8B7B66;--text-light:#B5A48E;--accent-pink:#E8B4B8;--accent-pink-light:#F5DCDE;--accent-brown:#C9A882;--accent-brown-light:#E8D9C2;--accent-green:#A8C9A0;--accent-green-light:#D6E8D2;--accent-blue:#A3B8C9;--accent-blue-light:#D2DDE6;--accent-yellow:#E8D5A8;--accent-yellow-light:#F5EBCF;--accent-purple:#C9B4D6;--accent-purple-light:#E8DCEF;--border-color:#E8DFD0;--shadow-soft:0 4px 16px rgba(139,123,102,0.08);--shadow-hover:0 6px 24px rgba(139,123,102,0.15);--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;--safe-bottom:env(safe-area-inset-bottom,0px);--nav-height:64px;--nav-total:calc(var(--nav-height) + var(--safe-bottom));}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Noto Color Emoji","Apple Color Emoji",sans-serif;background:var(--bg-main);color:var(--text-primary);}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-total);background:var(--bg-sidebar);border-top:1px solid var(--border-color);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;padding-bottom:var(--safe-bottom);z-index:100;box-shadow:0 -2px 12px rgba(139,123,102,0.06);}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px 4px;min-width:0;flex:1;cursor:pointer;transition:all 0.25s ease;color:var(--text-light);font-size:10px;font-weight:500;border-radius:var(--radius-sm);position:relative;-webkit-user-select:none;user-select:none;}
.nav-item .nav-icon{font-size:22px;line-height:1;}
.nav-item.active{color:var(--text-primary);font-weight:600;background:var(--accent-brown-light);transform:scale(1.05);}
.nav-item.active::after{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:var(--accent-brown);border-radius:2px;}
.main-content{flex:1;padding:20px 18px;padding-bottom:calc(var(--nav-total) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page{display:none;animation:fadeIn 0.35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.page-title{font-size:22px;font-weight:700;color:var(--text-primary);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.page-title-icon{font-size:24px;}
.page-subtitle{font-size:12px;color:var(--text-light);margin-bottom:20px;line-height:1.4;}
.dashboard-hero{background:linear-gradient(135deg,var(--accent-brown-light) 0%,var(--accent-pink-light) 100%);border-radius:var(--radius-xl);padding:28px 20px;margin-bottom:16px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden;}
.dashboard-hero::after{content:'☁️';position:absolute;top:12px;right:20px;font-size:30px;opacity:0.3;}
.clock-section{text-align:center;}
.clock-time{font-size:44px;font-weight:300;color:var(--text-primary);letter-spacing:2px;font-variant-numeric:tabular-nums;}
.clock-date{font-size:14px;color:var(--text-secondary);margin-top:6px;}
.clock-lunar{font-size:12px;color:var(--text-light);margin-top:2px;}
.info-bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
.info-card{background:rgba(255,255,255,0.6);border-radius:var(--radius-sm);padding:8px 12px;font-size:11px;line-height:1.5;color:var(--text-secondary);text-align:left;flex:1;min-width:120px;max-width:180px;}
.info-card-title{font-size:10px;font-weight:600;color:var(--text-primary);margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.info-card-yi{color:var(--accent-green);font-weight:600;}
.info-card-ji{color:var(--accent-pink);font-weight:600;}
.clock-greeting{font-size:16px;color:var(--text-primary);margin-top:10px;font-weight:500;}
.quote-card{background:linear-gradient(135deg,var(--accent-purple-light) 0%,var(--accent-blue-light) 100%);border-radius:var(--radius-lg);padding:22px 20px;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;margin-bottom:16px;}
.quote-card::before{content:'"';position:absolute;top:-8px;left:14px;font-size:80px;color:rgba(255,255,255,0.5);font-family:Georgia,serif;}
.quote-chinese{font-size:17px;font-weight:600;color:var(--text-primary);line-height:1.6;position:relative;z-index:1;}
.quote-english{font-size:12px;color:var(--text-secondary);margin-top:10px;font-style:italic;line-height:1.5;position:relative;z-index:1;}
.quote-refresh{margin-top:16px;align-self:flex-end;background:rgba(255,255,255,0.5);border:none;padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:11px;color:var(--text-secondary);transition:all 0.25s ease;}
.quote-refresh:active{background:rgba(255,255,255,0.8);}

/* 待办清单 */
.todo-section{margin-bottom:16px;}
.todo-card{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-soft);border:2px solid var(--border-color);}
.todo-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.todo-list{display:flex;flex-direction:column;gap:8px;}
.todo-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);padding:8px 12px;background:var(--bg-main);border-radius:var(--radius-sm);border:1px solid var(--border-color);transition:all 0.2s ease;}
.todo-item.done{background:var(--accent-green-light);color:var(--text-primary);border-color:var(--accent-green);}
.todo-item.done .todo-text{text-decoration:line-through;opacity:0.6;}
.todo-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border-color);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all 0.2s ease;flex-shrink:0;}
.todo-item.done .todo-check{background:var(--accent-green);border-color:var(--accent-green);color:white;}
.todo-text{flex:1;word-break:break-word;}
.todo-del{font-size:12px;color:var(--text-light);cursor:pointer;padding:2px 4px;flex-shrink:0;}
.todo-input-row{display:flex;gap:8px;margin-top:10px;}
.todo-input{flex:1;padding:8px 12px;border:2px solid var(--border-color);border-radius:var(--radius-sm);font-size:13px;color:var(--text-primary);background:var(--bg-main);font-family:inherit;}
.todo-input:focus{outline:none;border-color:var(--accent-brown);}
.todo-add-btn{padding:8px 14px;border:none;border-radius:var(--radius-sm);background:var(--accent-brown);color:white;font-size:12px;cursor:pointer;font-weight:500;}

/* 模块核心数据卡片（首页） */
.module-data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.module-data-card{background:var(--bg-card);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-soft);border:2px solid var(--border-color);cursor:pointer;transition:all 0.25s ease;display:flex;flex-direction:column;gap:6px;}
.module-data-card:active{transform:scale(0.97);}
.module-data-header{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-primary);}
.module-data-icon{font-size:18px;}
.module-data-values{display:flex;gap:6px;flex-wrap:wrap;}
.module-data-val{font-size:12px;color:var(--text-secondary);background:var(--bg-main);padding:3px 8px;border-radius:6px;border:1px solid var(--border-color);}
.module-data-val strong{color:var(--text-primary);font-weight:600;}
.module-data-arrow{font-size:11px;color:var(--text-light);align-self:flex-end;}

/* 复盘模块独立总结 */
.review-module{background:var(--bg-card);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-soft);border-left:4px solid var(--accent-brown);transition:border-color 0s;}
.review-module.en-mod{border-left-color:var(--accent-blue);}
.review-module.ex-mod{border-left-color:var(--accent-green);}
.review-module.food-mod{border-left-color:var(--accent-yellow);}
.review-module.fin-mod{border-left-color:var(--accent-brown);}
.review-module.media-mod{border-left-color:var(--accent-purple);}
.review-module.news-mod{border-left-color:var(--accent-blue);}
.review-module.mood-mod{border-left-color:var(--accent-purple);}
.review-module.todo-mod{border-left-color:var(--accent-pink);}
.review-module-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.review-module-body{font-size:12px;color:var(--text-secondary);line-height:1.6;}
.review-module-body .rv-empty{color:var(--text-light);font-style:italic;}
.stat-card{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;text-align:center;box-shadow:var(--shadow-soft);border:2px solid var(--border-color);transition:all 0.25s ease;}
.stat-card:active{transform:scale(0.97);}
.stat-icon{font-size:28px;margin-bottom:6px;}
.stat-value{font-size:20px;font-weight:700;color:var(--text-primary);}
.stat-label{font-size:11px;color:var(--text-light);margin-top:2px;}
.section-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.toolbar-left{display:flex;gap:8px;align-items:center;}
.mode-toggle{display:flex;background:var(--bg-card);border-radius:var(--radius-sm);padding:2px;border:1px solid var(--border-color);}
.mode-btn{padding:5px 12px;border:none;background:none;cursor:pointer;font-size:11px;color:var(--text-secondary);border-radius:6px;transition:all 0.2s ease;}
.mode-btn.active{background:var(--accent-brown-light);color:var(--text-primary);font-weight:600;}
.btn{padding:8px 16px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:500;transition:all 0.25s ease;display:inline-flex;align-items:center;gap:4px;}
.btn-primary{background:var(--accent-brown);color:white;}
.btn-primary:active{background:#B89668;transform:scale(0.97);}
.btn-soft{background:var(--accent-brown-light);color:var(--text-primary);}
.btn-soft:active{background:#DDC9A8;}
.btn-danger{background:var(--accent-pink-light);color:#A66;}
.btn-danger:active{background:var(--accent-pink);color:white;}
.btn-small{padding:5px 10px;font-size:11px;}
.item-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.item-card{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-soft);border:2px solid var(--border-color);transition:all 0.25s ease;position:relative;}
.item-card:active{transform:scale(0.98);}
.item-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.item-title{font-size:14px;font-weight:600;color:var(--text-primary);flex:1;word-break:break-word;}
.item-delete{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-light);padding:2px 6px;border-radius:4px;transition:all 0.2s ease;flex-shrink:0;}
.item-content{font-size:12px;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.item-meta{font-size:10px;color:var(--text-light);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-color);display:flex;justify-content:space-between;align-items:center;}
.item-tag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:500;}
.add-form{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-soft);border:2px solid var(--border-color);display:none;}
.add-form.show{display:block;animation:slideDown 0.3s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.form-group{margin-bottom:12px;}
.form-label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;font-weight:500;}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 12px;border:2px solid var(--border-color);border-radius:var(--radius-sm);font-size:14px;color:var(--text-primary);background:var(--bg-main);font-family:inherit;transition:border-color 0.2s ease;}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--accent-brown);}
.form-textarea{resize:vertical;min-height:60px;}
.form-actions{display:flex;gap:8px;justify-content:flex-end;}
.empty-state{text-align:center;padding:40px 16px;color:var(--text-light);}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:0.5;}
.empty-text{font-size:13px;}
.module-card{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-soft);border:2px solid var(--border-color);}
.module-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.module-item{font-size:12px;color:var(--text-secondary);line-height:1.5;padding:8px 12px;background:var(--bg-main);border-radius:var(--radius-sm);border:1px solid var(--border-color);position:relative;display:flex;align-items:flex-start;gap:6px;}
.module-item .mi-text{flex:1;word-break:break-word;}
.module-item .mi-del{font-size:12px;color:var(--text-light);cursor:pointer;padding:2px 4px;flex-shrink:0;}
.en-module{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-soft);border-left:4px solid var(--accent-blue);}
.en-module-content{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-soft);border-left:4px solid var(--accent-purple);}
.en-module-review{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-soft);border-left:4px solid var(--accent-yellow);}
.en-module-lang{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-soft);border-left:4px solid var(--accent-green);}
.lang-week-display{font-size:22px;font-weight:700;color:var(--accent-green);margin-bottom:8px;}
.lang-week-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.lang-week-nav button{background:var(--bg-main);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:4px 10px;font-size:14px;cursor:pointer;}
.lang-week-nav button:active{background:var(--bg-hover);}
.lang-week-nav .lang-week-num{font-size:18px;font-weight:700;color:var(--accent-green);}
.lang-task-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-main);border-radius:var(--radius-sm);margin-bottom:6px;border:1px solid var(--border-color);font-size:13px;}
.lang-task-item .lang-task-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--accent-green);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;flex-shrink:0;}
.lang-task-item .lang-task-check.done{background:var(--accent-green);color:#fff;border-color:var(--accent-green);}
.lang-task-item .lang-task-text{flex:1;word-break:break-word;}
.lang-task-item .lang-task-del{font-size:12px;color:var(--text-light);cursor:pointer;padding:2px 4px;}
.lang-tutorial-area{background:var(--bg-main);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border-color);font-size:13px;line-height:1.6;min-height:60px;white-space:pre-wrap;word-break:break-word;}
.en-module-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.en-modules{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}

/* 日历 */
.calendar{margin-bottom:16px;}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px;}
.cal-month{font-size:16px;font-weight:600;color:var(--text-primary);}
.cal-nav{background:none;border:none;font-size:18px;color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:4px;}
.cal-nav:active{background:var(--bg-hover);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px;color:var(--text-light);margin-bottom:4px;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:8px;color:var(--text-secondary);cursor:pointer;transition:all 0.2s ease;position:relative;}
.cal-day:active{transform:scale(0.9);}
.cal-day.today{font-weight:700;color:var(--text-primary);border:2px solid var(--accent-brown);}
.cal-day.checked{background:var(--accent-green-light);color:var(--accent-green);font-weight:600;}
.cal-day.checked::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--accent-green);border-radius:50%;}
.cal-day.has-meal{background:var(--accent-yellow-light);color:var(--accent-yellow);}
.cal-day.empty{color:transparent;pointer-events:none;}
.cal-day.other-month{color:var(--text-light);opacity:0.4;}

/* 餐饮 */
.meal-row{display:flex;gap:10px;margin-bottom:10px;}
.meal-slot{flex:1;background:var(--bg-card);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-soft);border:2px solid var(--border-color);}
.meal-slot-title{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:4px;}
.meal-slot-input{width:100%;padding:8px 10px;border:2px solid var(--border-color);border-radius:var(--radius-sm);font-size:13px;color:var(--text-primary);background:var(--bg-main);font-family:inherit;}
.meal-slot-input:focus{outline:none;border-color:var(--accent-brown);}

/* 新闻热点 */
.hot-section{margin-bottom:16px;}
.hot-platform{margin-bottom:12px;}
.hot-platform-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.hot-list{display:flex;flex-direction:column;gap:6px;}
.hot-item{font-size:12px;color:var(--text-secondary);padding:8px 12px;background:var(--bg-main);border-radius:var(--radius-sm);border:1px solid var(--border-color);line-height:1.5;display:flex;align-items:center;gap:6px;}
.hot-rank{font-size:11px;font-weight:700;color:var(--accent-brown);flex-shrink:0;width:20px;}
.hot-text{flex:1;}
.hot-summary{font-size:11px;color:var(--text-light);margin-top:12px;padding:10px 12px;background:var(--accent-blue-light);border-radius:var(--radius-sm);line-height:1.6;}
.hot-loading{font-size:12px;color:var(--text-light);text-align:center;padding:20px;}

/* 自媒体粉丝 */
.fans-section{background:var(--bg-card);border-radius:var(--radius-md);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-soft);border:2px solid var(--border-color);}
.fans-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.fans-row{display:flex;gap:12px;margin-bottom:10px;}
.fans-card{flex:1;text-align:center;padding:10px;background:var(--bg-main);border-radius:var(--radius-sm);border:1px solid var(--border-color);}
.fans-label{font-size:11px;color:var(--text-secondary);margin-bottom:4px;}
.fans-value{font-size:18px;font-weight:700;color:var(--text-primary);}
.fans-change{font-size:10px;margin-top:2px;}
.fans-change.up{color:var(--accent-green);}
.fans-change.down{color:var(--accent-pink);}
.fans-input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.fans-input-label{font-size:12px;color:var(--text-secondary);flex-shrink:0;width:80px;}
.fans-input{flex:1;padding:8px 10px;border:2px solid var(--border-color);border-radius:var(--radius-sm);font-size:13px;color:var(--text-primary);background:var(--bg-main);font-family:inherit;}

function getLunar(dateStr){const d=LUNAR_DATA[dateStr];if(!d)return null;return{zodiac:d[0],ganzhi:d[1],month:d[2],day:d[3],yi:d[4]||'—',ji:d[5]||'—',jie:d[6]||''};}

async function loadAlmanacWeather(){
  const today=S.today();
  // 农历 + 宜忌 - 本地查找表（无需API）
  try{
    const L=getLunar(today);
    if(L){
      const lunarEl=document.getElementById('clockLunar');
      if(lunarEl){lunarEl.textContent='农历'+L.month+L.day+' · '+L.zodiac+' · '+L.ganzhi;}
      const alEl=document.getElementById('almanacCard');
      if(alEl){
        const title=L.jie?`📅 黄历 · ${L.jie}`:`📅 农历 · ${L.month}${L.day}`;
        alEl.innerHTML=`<div class="info-card-title">${title}</div><div style="font-size:12px;color:var(--text-light);margin-bottom:3px;">${L.ganzhi} · ${L.zodiac}</div><div style="margin-bottom:3px;"><span class="info-card-yi">宜</span> ${esc(L.yi)}</div><div><span class="info-card-ji">忌</span> ${esc(L.ji)}</div>`;
      }
    }else{
      throw new Error('lunar data not found for '+today);
    }
  }catch(e){console.error('[lunar] error',e);const lunarEl=document.getElementById('clockLunar');if(lunarEl)lunarEl.textContent='农历暂不可用';const alEl=document.getElementById('almanacCard');if(alEl)alEl.innerHTML='<div class="info-card-title">📅 黄历</div>暂不可用';}
  // 天气 - 优先用wttr.in（国内可访问），备用open-meteo
  function fetchWeather(lat,lon,label){
    const wEl=document.getElementById('weatherCard');
    // 方案1: wttr.in (支持CORS，国内可访问)
    fetch('https://wttr.in/'+lat+','+lon+'?format=j1',{signal:AbortSignal.timeout(6000)}).then(r=>r.json()).then(w=>{
      const cc=w.current_condition[0];
      const temp=cc.temp_C;
      const hum=cc.humidity;
      const wind=cc.windspeedKmph;
      const code=cc.weatherCode;

      const wDesc=wMap[code]||'🌡️ '+code;

    }).catch(()=>{
      // 方案2: open-meteo备用
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m',{signal:AbortSignal.timeout(6000)}).then(r=>r.json()).then(wRes=>{
        if(wRes&&wRes.current){
          const c=wRes.current;const temp=Math.round(c.temperature_2m);const hum=c.relative_humidity_2m;const wind=c.wind_speed_10m;
          const wcode=c.weather_code;
          const wMap2={0:'☀️ 晴',1:'🌤️ 多云',2:'⛅ 阴',3:'☁️ 阴',45:'🌫️ 雾',48:'🌫️ 冻雾',51:'🌦️ 小雨',53:'🌦️ 小雨',55:'🌧️ 中雨',61:'🌧️ 雨',63:'🌧️ 中雨',65:'⛈️ 大雨',71:'🌨️ 小雪',73:'🌨️ 中雪',75:'❄️ 大雪',80:'🌧️ 阵雨',81:'🌧️ 阵雨',82:'⛈️ 大阵雨',95:'⛈️ 雷雨',96:'⛈️ 雷雨',99:'⛈️ 大雷雨'};
          const wDesc2=wMap2[wcode]||'🌡️ '+wcode;
          if(wEl)wEl.innerHTML=`<div class="info-card-title">🌤️ ${label||'天气'}</div><div style="font-size:14px;font-weight:700;color:var(--text-primary);">${temp}°C ${wDesc2}</div><div style="margin-top:2px;">湿度 ${hum}% · 风速 ${Math.round(wind)}km/h</div>`;
        }
      }).catch(e=>{console.error('[weather] error',e);if(wEl)wEl.innerHTML='<div class="info-card-title">🌤️ 天气</div>暂不可用';});
    });
  }
  // 反向地理编码：用坐标获取城市名
  function fetchWeatherWithCity(lat,lon){
    fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&lon='+lon,{signal:AbortSignal.timeout(5000)}).then(r=>r.json()).then(geo=>{
      let cityName='';
      if(geo&&geo.city){cityName=geo.city;}
      else if(geo&&geo.locality){cityName=geo.locality;}
      else if(geo&&geo.principalSubdivision){cityName=geo.principalSubdivision;}
      if(!cityName)cityName='当前位置';
      fetchWeather(lat,lon,cityName+'天气');
    }).catch(()=>{fetchWeather(lat,lon,'当前位置天气');});
  }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      fetchWeatherWithCity(pos.coords.latitude,pos.coords.longitude);
    },err=>{
      console.warn('[geolocation] denied or error, fallback to London',err);
      fetchWeather(51.5074,-0.1278,'伦敦天气');
    },{enableHighAccuracy:false,timeout:5000,maximumAge:600000});
  }else{
    fetchWeather(51.5074,-0.1278,'伦敦天气');
  }
}

// ========== 日历 ==========
function renderCalendar(month,year,checkData,type){const d=new Date();const todayStr=S.today();const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();const prevDays=new Date(year,month,0).getDate();const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];let days='';for(let i=0;i<firstDay;i++){days+=`<div class="cal-day other-month">${prevDays-firstDay+i+1}</div>`;}for(let i=1;i<=daysInMonth;i++){const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;const isToday=ds===todayStr;const isChecked=checkData[ds];let cls='cal-day';if(isToday)cls+=' today';if(isChecked)cls+=' checked';const clickFn=type==='exercise'?`toggleExCheckin('${ds}')`:`toggleFoodCheckin('${ds}')`;days+=`<div class="${cls}" data-date="${ds}" onclick="${clickFn}">${i}</div>`;}const totalCells=firstDay+daysInMonth;const rem=totalCells%7===0?0:7-totalCells%7;for(let i=1;i<=rem;i++){days+=`<div class="cal-day other-month">${i}</div>`;}
return`<div class="cal-header"><button class="cal-nav" onclick="navCal(${month-1},${year},'${type}')">◀</button><span class="cal-month">${year}年${monthNames[month]}</span><button class="cal-nav" onclick="navCal(${month+1},${year},'${type}')">▶</button></div><div class="cal-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="cal-days">${days}</div>`;}
function navCal(m,y,type){if(m<0){m=11;y--;}if(m>11){m=0;y++;}const ck=type==='exercise'?S.get('ex_checkins',{}):S.get('food_meals',{});document.getElementById(type==='exercise'?'exCalendar':'foodCalendar').innerHTML=renderCalendar(m,y,ck,type);}
function toggleExCheckin(ds){const ck=S.get('ex_checkins',{});ck[ds]=!ck[ds];S.set('ex_checkins',ck);renderPage('exercise');}
function toggleFoodCheckin(ds){const meals=S.get('food_meals',{});if(meals[ds])delete meals[ds];else meals[ds]={breakfast:'',lunch:'',dinner:'',drinks:['']};S.set('food_meals',meals);renderPage('food');}

// ========== 好好吃饭 ==========
function pgFood(){const today=S.today();const rawMeals=S.get('food_meals',{});const todayMeal=rawMeals[today]||{breakfast:'',lunch:'',dinner:'',drinks:['']};

function removeDrink(idx){
  const list=document.getElementById('drinkList');const items=list.querySelectorAll('.drink-item');

  const monthStats={};records.forEach(r=>{const m=(r.date||'').substring(0,7)||'未知';if(!monthStats[m])monthStats[m]={expense:0,income:0};monthStats[m][r.type]=(monthStats[m][r.type]||0)+parseFloat(r.amount||0);});
  const sortedMonths=Object.keys(monthStats).sort().reverse();
  const monthHTML=sortedMonths.map(m=>{const s=monthStats[m];return`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border-color);"><span style="font-size:12px;">${esc(m)}</span><span style="font-size:12px;"><span style="color:var(--accent-pink);">-${sym}${s.expense.toFixed(2)}</span>${s.income>0?` <span style="color:var(--accent-green);">+${sym}${s.income.toFixed(2)}</span>`:''}</span></div>`}).join('');

  let pieAcc=0;const pieSlices=pieCats.map(k=>{const val=catStats[k].expense;const pct=(val/pieTotal)*100;const startAng=pieAcc*3.6;pieAcc+=pct;const endAng=pieAcc*3.6;const startRad=(startAng-90)*Math.PI/180;const endRad=(endAng-90)*Math.PI/180;const cx=50,cy=50,r=40;const x1=cx+r*Math.cos(startRad),y1=cy+r*Math.sin(startRad);const x2=cx+r*Math.cos(endRad),y2=cy+r*Math.sin(endRad);const largeArc=(endAng-startAng)>180?1:0;const color=pieColors[k]||'#B5A48E';return{path:`M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`,color,k,val,pct};});

  const platLegend=platSlices.map(s=>`<div style="display:flex;align-items:center;gap:6px;margin:3px 0;"><span style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block;"></span><span style="font-size:11px;color:var(--text-secondary);">${esc(s.k)} ${sym}${s.val.toFixed(2)} (${s.pct.toFixed(1)}%)</span></div>`).join('');

  <div class="summary-block"><div class="summary-block-title">📊 分类统计</div><div class="summary-block-content">${catHTML||'暂无数据'}</div></div>`;

<div class="item-grid">${!display.length?'<div class="empty-state"><div class="empty-icon">💰</div><div class="empty-text">'+(mode==='daily'?'今天还没有记账～':'暂无记录')+'</div></div>':display.map(r=>`<div class="item-card finance-card"><div class="item-card-header"><div class="item-title">${esc(r.category)} <span style="font-size:11px;color:var(--text-light);font-weight:400;">${esc(r.date||'')}</span></div><div><button class="item-edit" onclick="editFin('${r.id}')" style="background:none;border:none;font-size:14px;cursor:pointer;margin-right:6px;opacity:0.5;">✏️</button><button class="item-delete" onclick="deleteItem('finance_records','${r.id}')">🗑️</button></div></div><div class="finance-amount ${r.type==='expense'?'expense':''}">${r.type==='expense'?'-':'+'}${sym}${parseFloat(r.amount).toFixed(2)}</div>${r.note?`<div class="item-content" style="margin-top:4px;">${esc(r.note)}</div>`:''}<div class="item-meta"><span class="item-tag" style="background:${r.type==='expense'?'var(--accent-pink-light)':'var(--accent-green-light)'};color:${r.type==='expense'?'#A66':'#5A7A52'}">${r.type==='expense'?'💸 支出':'💵 收入'}</span>${r.platform?`<span class="item-tag" style="background:var(--accent-blue-light);color:#4A6A82;margin-left:4px;">${esc(r.platform)}</span>`:''}</div></div>`).join('')}</div>`;}
async function loadExchangeInfo(){const currency=S.get('finance_currency','CNY');if(currency==='CNY')return;const rates=await getExchangeRates();if(!rates)return;const el=document.getElementById('exchangeInfo');if(!el)return;const rate=rates[currency];if(rate){el.innerHTML=`<div class="summary-block" style="border-left:4px solid var(--accent-blue);"><div class="summary-block-title">💱 今日汇率</div><div class="summary-block-content">1 人民币(CNY) = <strong>${rate.toFixed(4)} ${currency}</strong><br>1 ${currency} = <strong>${(1/rate).toFixed(4)} 人民币(CNY)</strong></div></div>`;}}
const FIN_CATS={expense:[['餐饮','🍽️'],['交通','🚌'],['购物','🛍️'],['学习','📚'],['住房','🏠'],['娱乐','🎮'],['其他','📦']],income:[['工资','💼'],['红包','🧧'],['理财收入','📈'],['其他','📦']]};
function updateFinCat(){const t=document.getElementById('finType');const c=document.getElementById('finCat');if(!t||!c)return;c.innerHTML=FIN_CATS[t.value].map(([v,i])=>`<option value="${v}">${i} ${v}</option>`).join('');}
function updateEditFinCat(){const t=document.getElementById('editFinType');const c=document.getElementById('editFinCat');if(!t||!c)return;c.innerHTML=FIN_CATS[t.value].map(([v,i])=>`<option value="${v}">${i} ${v}</option>`).join('');const cur=document.getElementById('finEditForm')&&document.getElementById('finEditForm').dataset.cat;if(cur)c.value=cur;}
function addFin(){const t=document.getElementById('finType').value;const c=document.getElementById('finCat').value;const a=document.getElementById('finAmt').value.trim();const n=document.getElementById('finNote').value.trim();const dt=document.getElementById('finDate')?document.getElementById('finDate').value.trim():'';const p=document.getElementById('finPlatform')?document.getElementById('finPlatform').value:'其他';if(!a||parseFloat(a)<=0){showToast('请输入有效金额～');return;}const r=S.get('finance_records',[]);r.push({id:genId(),type:t,category:c,amount:a,note:n,date:dt||S.today(),time:S.now(),platform:p});S.set('finance_records',r);showToast('已记账 💰');renderPage('finance');}
function editFin(id){const records=S.get('finance_records',[]);const r=records.find(x=>x.id===id);if(!r)return;const currency=S.get('finance_currency','CNY');const sym=(CURRENCIES.find(c=>c.code===currency)||CURRENCIES[0]).symbol;
  if(document.getElementById('finEditForm')){document.getElementById('finEditForm').remove();return;}
  const form=document.createElement('div');form.className='add-form';form.style.display='block';form.id='finEditForm';

  <div class="form-group"><label class="form-label">日期</label><input type="date" class="form-input" id="editFinDate" value="${r.date||''}"></div>
  <div class="form-actions"><button class="btn btn-soft" onclick="document.getElementById('finEditForm').remove()">取消</button><button class="btn btn-primary" onclick="saveEditFin('${id}')">保存修改</button></div>`;
  const grid=document.querySelector('.item-grid');if(grid)grid.insertBefore(form,grid.firstChild);
  const editCat=document.getElementById('editFinCat');if(editCat){editCat.innerHTML=FIN_CATS[r.type||'expense'].map(([v,i])=>`<option value="${v}" ${r.category===v?'selected':''}>${i} ${v}</option>`).join('');}
}
function saveEditFin(id){const records=S.get('finance_records',[]);const idx=records.findIndex(x=>x.id===id);if(idx<0)return;
  const t=document.getElementById('editFinType').value;const c=document.getElementById('editFinCat').value;const a=document.getElementById('editFinAmt').value.trim();const n=document.getElementById('editFinNote').value.trim();const dt=document.getElementById('editFinDate').value.trim();const p=document.getElementById('editFinPlatform')?document.getElementById('editFinPlatform').value:'其他';
  if(!a||parseFloat(a)<=0){showToast('请输入有效金额～');return;}
  records[idx]={...records[idx],type:t,category:c,amount:a,note:n,date:dt||records[idx].date,platform:p};S.set('finance_records',records);showToast('修改已保存 ✏️');renderPage('finance');}

function getCityCoord(city){
  if(!city)return null;
  if(CITY_COORDS[city])return CITY_COORDS[city];
  // 模糊匹配
  for(const k in CITY_COORDS){if(city.includes(k)||k.includes(city))return CITY_COORDS[k];}
  return null;
}
// 缓存动态获取的城市坐标
let dynamicCityCoords={};
async function fetchCityCoord(city){
  if(!city)return null;
  if(CITY_COORDS[city])return CITY_COORDS[city];
  if(dynamicCityCoords[city])return dynamicCityCoords[city];
  try{
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=zh&format=json').then(r=>r.json());
    if(r&&r.latitude&&r.longitude){dynamicCityCoords[city]={lat:r.latitude,lon:r.longitude};return dynamicCityCoords[city];}
  }catch(e){}
  return null;
}
function pgTravel(){
  const today=S.today();const d=new Date();
  const records=S.get('travel_records',[]);
  // 按日期排序（新的在前）
  const sorted=records.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  // 统计
  const cities=[...new Set(records.map(r=>r.city).filter(Boolean))];
  const countries=[...new Set(records.map(r=>r.country).filter(Boolean))];
  const totalTrips=records.length;
  // 计算总旅游天数
  const totalTravelDays=records.reduce((sum,r)=>{const s=r.startDate||r.date;const e=r.endDate||r.startDate||r.date;if(!s)return sum;const sd=new Date(s);const ed=new Date(e);const diff=Math.ceil((ed-sd)/86400000)+1;return sum+(diff>0?diff:1);},0);
  // 每月频率（按时间正序用于折线图）
  const monthlyFreq={};records.forEach(r=>{const m=r.date?r.date.substring(0,7):'未知';monthlyFreq[m]=(monthlyFreq[m]||0)+1;});
  const sortedMonthsAsc=Object.keys(monthlyFreq).sort();
  // 自动建议
  let advice='';
  const advices=[];
  if(totalTrips===0)advices.push('还没有旅游记录，计划一次旅行吧！');
  else{
    if(cities.length<3)advices.push(`已去过 ${cities.length} 个城市，可以尝试探索更多地方`);
    else advices.push(`已去过 ${cities.length} 个城市，足迹遍布 ${countries.length} 个国家，继续保持探索！`);
    const thisMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!monthlyFreq[thisMonth])advices.push('本月还没有旅游记录，是不是该计划一次了？');
  }
  advice=advices.join(' ');

  // 地图点亮：收集有坐标的城市
  const mapPins=cities.map(city=>{const c=getCityCoord(city);if(!c)return null;return{city,lat:c.lat,lon:c.lon};}).filter(Boolean);
  // 未定位城市列表
  const unmappedCities=cities.filter(c=>!getCityCoord(c));

  // 折线图数据
  const chartLabels=sortedMonthsAsc.slice(-12); // 最近12个月
  const chartData=chartLabels.map(m=>monthlyFreq[m]);
  const maxVal=Math.max(...chartData,1);
  const chartPoints=chartLabels.map((m,i)=>{const x=(i/(Math.max(chartLabels.length-1,1)))*100;const y=100-(chartData[i]/maxVal)*80-10;return{x,y};});
  const chartPath=chartPoints.map((p,i)=>(i===0?'M':'L')+p.x+' '+p.y).join(' ');
  const chartAreaPath=chartPoints.length?chartPath+` L 100 100 L 0 100 Z`:'';

  return`<div class="page-title"><span class="page-title-icon">🌍</span>旅游记录</div><div class="page-subtitle">记录每一次旅途的足迹 🌍</div>
  <div class="finance-stats">
    <div class="stat-card" style="border-color:var(--accent-purple);"><div class="stat-icon">🏙️</div><div class="stat-value" style="color:var(--accent-purple);">${cities.length}</div><div class="stat-label">城市</div></div>
    <div class="stat-card" style="border-color:var(--accent-green);"><div class="stat-icon">🌍</div><div class="stat-value" style="color:var(--accent-green);">${countries.length}</div><div class="stat-label">国家</div></div>
    <div class="stat-card" style="border-color:var(--accent-blue);"><div class="stat-icon">📅</div><div class="stat-value" style="color:var(--accent-blue);">${totalTravelDays}</div><div class="stat-label">总天数</div></div>
  </div>
  ${countries.length?`<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;padding:10px 14px;background:var(--bg-card);border-radius:var(--radius-md);box-shadow:var(--shadow-soft);"><strong>🌍 去过的国家：</strong>${countries.map(c=>`<span style="display:inline-block;margin:2px 4px;padding:2px 10px;background:var(--accent-green-light);border-radius:12px;font-size:12px;">${esc(c)}</span>`).join('')}</div>`:''}
  ${mapPins.length?`
  <div style="font-size:15px;font-weight:600;margin:16px 0 8px;">🗺️ 城市足迹地图 <span style="font-size:11px;color:var(--text-light);font-weight:400;">（可缩放拖动）</span></div>
  <div class="travel-map-container">
    <div id="travelMap"></div>
    <div class="travel-map-legend">${mapPins.map(p=>`<span class="map-pin-tag">📍 ${esc(p.city)}</span>`).join('')}${unmappedCities.length?unmappedCities.map(c=>`<span class="map-pin-tag" style="opacity:0.5;">📍 ${esc(c)}（定位中）</span>`).join(''):''}</div>
  </div>`:''}
  ${chartLabels.length?`
  <div style="font-size:15px;font-weight:600;margin:16px 0 8px;">📊 旅游频率趋势</div>
  <div class="travel-chart-container">
    <svg class="travel-chart" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C9B4D6" stop-opacity="0.3"/><stop offset="100%" stop-color="#C9B4D6" stop-opacity="0.02"/></linearGradient></defs>
      ${chartAreaPath?`<path d="${chartAreaPath}" fill="url(#chartGrad)"/>`:''}
      ${chartPath?`<path d="${chartPath}" fill="none" stroke="#C9B4D6" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}
      ${chartPoints.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="1.2" fill="#C9B4D6"/>`).join('')}
    </svg>
    <div class="travel-chart-labels">${chartLabels.map((m,i)=>`<span class="chart-label">${m.split('-')[1]}月</span>`).join('')}</div>

let travelMapInstance=null;
function initTravelMap(){
  const mapEl=document.getElementById('travelMap');if(!mapEl)return;
  // 清理旧地图实例
  if(travelMapInstance){travelMapInstance.remove();travelMapInstance=null;}
  const records=S.get('travel_records',[]);const cities=[...new Set(records.map(r=>r.city).filter(Boolean))];
  const pins=cities.map(city=>{const c=getCityCoord(city);if(!c)return null;const cityTrips=records.filter(r=>r.city===city);return{city,lat:c.lat,lon:c.lon,trips:cityTrips};}).filter(Boolean);
  if(!pins.length)return;
  // 创建地图
  travelMapInstance=L.map('travelMap',{zoomControl:true,scrollWheelZoom:false}).setView([pins[0].lat,pins[0].lon],2);
  // 尝试多个瓦片源，确保可访问
  const tileLayer=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap, © CartoDB',subdomains:'abcd'});
  tileLayer.addTo(travelMapInstance);
  // 3秒后检查瓦片是否加载，失败则切换备选源
  let tileLoaded=false;
  tileLayer.on('tileload',()=>{tileLoaded=true;});
  setTimeout(()=>{
    if(!tileLoaded){
      tileLayer.remove();
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'© Esri'}).addTo(travelMapInstance);
    }
  },3000);
  // 自定义图标
  const pinIcon=L.divIcon({className:'travel-pin',html:'<div style="width:14px;height:14px;border-radius:50%;background:#E8B4B8;border:2px solid #C97A7E;box-shadow:0 0 6px rgba(201,122,126,0.6);"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  // 添加标记
  const bounds=[];
  pins.forEach(p=>{
    const popupHTML=`<div class="travel-map-popup"><strong>📍 ${esc(p.city)}</strong><br>共 ${p.trips.length} 次旅行`+p.trips.map(t=>`<br>📅 ${esc(t.startDate||t.date||'')}${t.endDate?'~ '+esc(t.endDate):''}${t.companion?' · '+esc(t.companion):''}`).join('')+'</div>';
    L.marker([p.lat,p.lon],{icon:pinIcon}).addTo(travelMapInstance).bindPopup(popupHTML);
    bounds.push([p.lat,p.lon]);
  });
  // 自动调整视野到包含所有标记
  if(bounds.length>1){travelMapInstance.fitBounds(bounds,{padding:[30,30],maxZoom:6});}
  else if(bounds.length===1){travelMapInstance.setView(bounds[0],5);}
  // 延迟修复 Leaflet 在隐藏容器中的渲染问题
  setTimeout(()=>{if(travelMapInstance)travelMapInstance.invalidateSize();},200);
}

const MOOD_OPTIONS=[{label:'开心',emoji:'😊',color:'#FFD700'},{label:'非常棒',emoji:'🥳',color:'#FF6B6B'},{label:'平静',emoji:'😌',color:'#87CEEB'},{label:'生气',emoji:'😤',color:'#FF4500'},{label:'难过',emoji:'😢',color:'#4169E1'},{label:'焦虑',emoji:'😰',color:'#FF8C00'},{label:'复杂',emoji:'🤔',color:'#9370DB'}];
let moodCalMonth=null;let moodCalYear=null;
function pgMood(){
  const d=new Date();if(!moodCalMonth)moodCalMonth=d.getMonth();if(!moodCalYear)moodCalYear=d.getFullYear();
  const today=S.today();const diary=S.get('mood_diary',{});const todayDiary=diary[today]||{};
  const monthDiaries={};Object.keys(diary).forEach(k=>{if(k.startsWith(`${moodCalYear}-${String(moodCalMonth+1).padStart(2,'0')}`))monthDiaries[k]=diary[k];});
  // 月历渲染
  const firstDay=new Date(moodCalYear,moodCalMonth,1).getDay();const daysInMonth=new Date(moodCalYear,moodCalMonth+1,0).getDate();const prevDays=new Date(moodCalYear,moodCalMonth,0).getDate();
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let calCells='';
  for(let i=0;i<firstDay;i++){calCells+=`<div class="mood-cal-day empty"></div>`;}
  for(let i=1;i<=daysInMonth;i++){
    const ds=`${moodCalYear}-${String(moodCalMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const isToday=ds===today;
    const dayData=monthDiaries[ds];
    const hasMood=dayData&&dayData.mood;
    const moodObj=hasMood?MOOD_OPTIONS.find(m=>m.label===dayData.mood):null;
    let cls='mood-cal-day';if(isToday)cls+=' today';if(hasMood)cls+=' has-mood';
    calCells+=`<div class="${cls}" onclick="selectMoodDate('${ds}')">${hasMood?`<span class="mood-emoji">${moodObj?moodObj.emoji:'📝'}</span>`:''}<span class="mood-date-num">${i}</span></div>`;
  }
  const totalCells=firstDay+daysInMonth;const rem=totalCells%7===0?0:7-totalCells%7;
  for(let i=1;i<=rem;i++){calCells+=`<div class="mood-cal-day empty"></div>`;}
  const moodCount=Object.keys(monthDiaries).filter(k=>monthDiaries[k].mood).length;
  // 心情统计
  let moodStats='';
  if(moodCount>0){const counts={};Object.keys(monthDiaries).forEach(k=>{const m=monthDiaries[k].mood;if(m)counts[m]=(counts[m]||0)+1;});moodStats=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).map(m=>{const mo=MOOD_OPTIONS.find(o=>o.label===m);return`<span style="font-size:13px;">${mo?mo.emoji:'📝'} ${m} <strong>${counts[m]}</strong>天</span>`;}).join(' · ');}

  // 选中日期的心情记录
  const selectedDate=today; // 默认显示今日
  const selDiary=diary[selectedDate]||{};

  return`<div class="page-title"><span class="page-title-icon">💭</span>心情日记</div><div class="page-subtitle">记录每一天的心情 🌈</div>
  <div class="mood-calendar">

    <div class="mood-calendar-grid">

      ${calCells}
    </div>
    <div style="font-size:12px;color:var(--text-light);margin-top:6px;">本月已记录 <strong>${moodCount}/${daysInMonth}</strong> 天心情</div>
    ${moodStats?`<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${moodStats}</div>`:''}
  </div>
  <div style="font-size:14px;font-weight:600;margin:14px 0 8px;">📝 ${today} 心情记录</div>

    ${MOOD_OPTIONS.map(m=>`<div class="mood-pick-item ${selMood===m.label?'selected':''}" onclick="pickMood('${m.label}','${today}')">${m.emoji} ${m.label}</div>`).join('')}

  const reviewCount=S.get('review_records',[]).length;
  const moodDays=Object.keys(S.get('mood_diary',{})).length;
  return`<div class="page-title"><span class="page-title-icon">📤</span>数据导出</div><div class="page-subtitle">备份所有记录，安全无忧 🔐</div>
  <div class="export-section">
    <div class="summary-block"><div class="summary-block-title">📊 数据概览</div><div class="summary-block-content">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;">
        <div>📋 待办 <strong>${todosCount}</strong> 条</div>
        <div>📚 英语内容 <strong>${enContentCount}</strong> 条</div>
        <div>💬 英语表达 <strong>${enExprCount}</strong> 个</div>
        <div>🎓 语言班任务 <strong>${langTasksCount}</strong> 条</div>
        <div>🏃 运动记录 <strong>${exRecCount}</strong> 条</div>
        <div>🍽️ 饮食天数 <strong>${foodDays}</strong> 天</div>
        <div>💰 理财记录 <strong>${finCount}</strong> 条</div>
        <div>🌍 旅游 <strong>${travelCount}</strong> 次</div>
        <div>📰 新闻 <strong>${newsCount}</strong> 条</div>
        <div>📝 复盘 <strong>${reviewCount}</strong> 条</div>
        <div>💭 心情日记 <strong>${moodDays}</strong> 天</div>
      </div>
    </div></div>
    <div style="font-size:14px;font-weight:600;margin:14px 0 8px;">选择导出方式</div>
    <div class="export-btn-group">
      <div class="export-btn" onclick="exportJSON()">📄 导出 JSON</div>
      <div class="export-btn" onclick="exportCSV()">📊 导出 CSV</div>
      <div class="export-btn" onclick="importData()">📥 导入数据</div>
    </div>
    <div class="export-info">JSON导出包含所有模块完整数据，适合备份还原<br>CSV导出为表格格式，适合Excel查看分析<br>导入数据将覆盖当前所有记录，请谨慎操作</div>
    <div id="exportResult" style="margin-top:12px;"></div>
    <div style="font-size:14px;font-weight:600;margin:18px 0 8px;">🗂️ 自动备份恢复</div>
    <div class="export-info" style="border-left:4px solid var(--accent-blue);">系统每次保存数据时自动创建备份（最多保留10份）。如果数据丢失，可从此处恢复。</div>
    <div id="backupList" style="margin-top:10px;"></div>
  </div>`;
}
function renderBackupList(){const list=document.getElementById('backupList');if(!list)return;const keys=Object.keys(localStorage).filter(k=>k.startsWith('sara_backup_')).sort().reverse();if(!keys.length){list.innerHTML='<div style="font-size:12px;color:var(--text-light);padding:10px;">暂无备份</div>';return;}list.innerHTML=keys.map(k=>{const ts=k.replace('sara_backup_','');const dateStr=ts.slice(0,8)+' '+ts.slice(8,10)+':'+ts.slice(10,12);let foodCount='—';try{const d=JSON.parse(localStorage.getItem(k));foodCount=Object.keys(d.food_meals||{}).length;}catch(e){}return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg-secondary);border-radius:8px;margin-bottom:6px;font-size:12px;"><div><div style="font-weight:600;">${dateStr}</div><div style="color:var(--text-light);">饮食记录: ${foodCount} 天</div></div><button onclick="restoreBackup('${k}')" style="background:var(--accent-blue);color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;">恢复</button></div>`;}).join('');}
function restoreBackup(key){showConfirm('确定恢复此备份吗？当前数据将被覆盖。',()=>{try{const data=JSON.parse(localStorage.getItem(key));Object.keys(data).forEach(k=>{if(SYNC_KEYS.includes(k)){localStorage.setItem(S.prefix+k,JSON.stringify(data[k]));}});showToast('备份已恢复 ✅');renderPage('export');}catch(e){showToast('恢复失败：'+e.message);}});}
function exportJSON(){
  const data={};SYNC_KEYS.forEach(k=>{const v=localStorage.getItem(S.prefix+k);if(v)data[k]=JSON.parse(v);});
  const jsonStr=JSON.stringify(data,null,2);
  const blob=new Blob([jsonStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`sara-data-${S.today()}.json`;a.click();URL.revokeObjectURL(url);
  showToast('JSON已导出 📄');
  document.getElementById('exportResult').innerHTML=`<div class="summary-block" style="border-left:4px solid var(--accent-green);"><div class="summary-block-title">✅ 导出成功</div><div class="summary-block-content">文件 <strong>sara-data-${S.today()}.json</strong> 已下载<br>包含 ${Object.keys(data).length} 个数据模块</div></div>`;
}
function exportCSV(){
  // 生成多模块CSV（合并为一个文件）
  let csv='模块,日期,内容/详情\n';
  // 待办
  S.get('todos',[]).forEach(r=>{csv+=`待办,${r.date},${esc(r.text)}${r.done?' [已完成]':''}\n`;});
  // 英语内容
  S.get('en_content',[]).forEach(r=>{csv+=`英语学习,${r.date},${esc(r.content)}\n`;});
  // 英语表达
  S.get('en_expression',[]).forEach(r=>{csv+=`英语表达,${r.date},${esc(r.en)} - ${esc(r.cn)}\n`;});
  // 运动
  S.get('exercise_records',[]).forEach(r=>{csv+=`锻炼,${r.date},${esc(r.name)} ${r.duration}分钟${r.note?' ('+esc(r.note)+')':''}\n`;});
  // 理财
  const exportSym=(CURRENCIES.find(c=>c.code===S.get('finance_currency','CNY'))||CURRENCIES[0]).symbol;
  S.get('finance_records',[]).forEach(r=>{csv+=`理财,${r.date},${r.type==='expense'?'支出':'收入'} ${exportSym}${r.amount} ${esc(r.category)}${r.note?' ('+esc(r.note)+')':''}\n`;});
  // 旅游
  S.get('travel_records',[]).forEach(r=>{csv+=`旅游,${r.date||r.startDate||''},${esc(r.summary||r.city+' '+r.country)}\n`;});
  // 新闻
  S.get('news_records',[]).forEach(r=>{csv+=`新闻,${r.date},${esc(r.title)} ${esc(r.source||'')}\n`;});
  // 心情日记
  const diary=S.get('mood_diary',{});Object.keys(diary).sort().forEach(k=>{const d=diary[k];csv+=`心情日记,${k},${d.mood||''}${d.text?' | '+esc(d.text):''}\n`;});
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`sara-data-${S.today()}.csv`;a.click();URL.revokeObjectURL(url);
  showToast('CSV已导出 📊');
  document.getElementById('exportResult').innerHTML=`<div class="summary-block" style="border-left:4px solid var(--accent-green);"><div class="summary-block-title">✅ 导出成功</div><div class="summary-block-content">文件 <strong>sara-data-${S.today()}.csv</strong> 已下载<br>包含所有模块的表格数据</div></div>`;
}
function importData(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(typeof data!=='object'){showToast('文件格式不正确');return;}
        Object.keys(data).forEach(k=>{
          if(SYNC_KEYS.includes(k)){localStorage.setItem(S.prefix+k,JSON.stringify(data[k]));}
        });
        syncToServer();
        showToast('数据已导入 ✅');renderPage('export');
        document.getElementById('exportResult').innerHTML=`<div class="summary-block" style="border-left:4px solid var(--accent-blue);"><div class="summary-block-title">✅ 导入成功</div><div class="summary-block-content">已导入 <strong>${Object.keys(data).length}</strong> 个数据模块<br>页面已刷新</div></div>`;
      }catch(err){showToast('文件解析失败，请确认是JSON格式');}
    };reader.readAsText(file);
  };input.click();
}

document.addEventListener('DOMContentLoaded',async()=>{
  // 先从服务器同步数据到 localStorage
  await syncFromServer();
  renderApp();updateClock();setInterval(updateClock,1000);
  const ld=S.get('quoteDate','');const td=S.today();
  if(ld!==td){S.set('quoteDate',td);S.set('quoteIndex',Math.floor(Math.random()*QUOTES.length));}
});
</script>
</body>
</html>
